# MarketPG production stack. The database is dedicated to MarketPG only.
databases:
  - name: marketpg-db
    databaseName: marketpg_db
    user: marketpg_db_user
    plan: free
    region: singapore
    postgresMajorVersion: 18
    ipAllowList: []

services:
  - type: web
    name: marketpg
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: MarketPG
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://marketpg.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: marketpg-db
          property: connectionString
      - key: MARKETPG_ADMIN_EMAILS
        sync: false
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_ENCRYPT
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: SESSION_SECURE_COOKIE
        value: "true"
