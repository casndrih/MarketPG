# Render Blueprint for MarketPG
# Reuses the existing Growgreen PostgreSQL instance.
# During Blueprint apply, provide Growgreen's INTERNAL Database URL as DB_URL.
# DB_PREFIX isolates every MarketPG table from Growgreen's application tables.

services:
  - type: web
    name: marketpg
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: MarketPG
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://marketpg.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_PREFIX
        value: marketpg_
      - key: MARKETPG_ADMIN_EMAILS
        sync: false
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
