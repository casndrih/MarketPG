name: MarketPG live API smoke test

on:
  push:
    branches: [main]
    paths: ['.github/workflows/marketpg-smoke.yml']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for MarketPG API
        run: |
          set -euo pipefail
          BASE="https://marketpg.onrender.com/api"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 6 \
            -H "Accept: application/json" "$BASE/health" -o /tmp/health.json
          cat /tmp/health.json
          jq -e '.status == "ok" and .database == "connected"' /tmp/health.json >/dev/null
      - name: Verify public categories
        run: |
          curl --fail --silent --show-error \
            -H "Accept: application/json" \
            "https://marketpg.onrender.com/api/categories" -o /tmp/categories.json
          jq -e '.data | type == "array" and length >= 1' /tmp/categories.json
      - name: Verify disputes API boundary
        run: |
          disputes_status=$(curl --silent --show-error -o /tmp/disputes.json -w "%{http_code}" \
            -H "Accept: application/json" "https://marketpg.onrender.com/api/disputes")
          test "$disputes_status" = "401"
      - name: Verify administrator sign-in page
        run: |
          curl --fail --silent --show-error             "https://marketpg.onrender.com/admin/login" -o /tmp/admin-login.html
          grep -q "Administrator access" /tmp/admin-login.html
      - name: Verify authentication boundaries
        run: |
          profile_status=$(curl --silent --show-error -o /tmp/profile.json -w "%{http_code}" \
            -H "Accept: application/json" "https://marketpg.onrender.com/api/profile")
          test "$profile_status" = "401"
          login_status=$(curl --silent --show-error -o /tmp/login.json -w "%{http_code}" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            -d '{}' "https://marketpg.onrender.com/api/auth/login")
          test "$login_status" = "422"
      - name: Verify protected admin dashboard redirect
        run: |
          curl --silent --show-error -D /tmp/admin.headers -o /dev/null \
            "https://marketpg.onrender.com/admin"
          grep -qi '^location:.*login' /tmp/admin.headers
      - name: Verify marketplace homepage
        run: |
          curl --fail --silent --show-error "https://marketpg.onrender.com/" -o /tmp/home.html
          grep -q "MarketPG" /tmp/home.html
      - name: Verify public listing search
        run: |
          curl --fail --silent --show-error \
            -H "Accept: application/json" \
            "https://marketpg.onrender.com/api/listings" -o /tmp/listings.json
          jq -e '.data | type == "array"' /tmp/listings.json
      - name: Verify demo catalog seed
        run: |
          jq -e '[.data[] | select(.user.name == "MarketPG Test Seller")] | length >= 20' /tmp/listings.json
