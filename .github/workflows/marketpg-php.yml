name: MarketPG PHP validation

on:
  push:
    branches: [main]
    paths:
      - 'backend/**/*.php'
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/marketpg-php.yml'
  pull_request:
    paths:
      - 'backend/**/*.php'
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/marketpg-php.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint all backend PHP files
        run: |
          set -e
          find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
