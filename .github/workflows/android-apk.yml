name: Build MarketPG Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marketpg-android-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
        working-directory: android
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketPG-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - name: Copy release APK to repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk MarketPG.apk
          git add MarketPG.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest MarketPG Android release APK"
            git push origin HEAD:main
          fi
      - name: Verify published APK
        run: test -s MarketPG.apk
