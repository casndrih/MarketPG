name: Build MarketPG Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
        working-directory: android
      - name: Publish APK at repository root
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk app-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-release.apk
          git commit -m "Build MarketPG Android APK" || echo "No APK changes"
          git push